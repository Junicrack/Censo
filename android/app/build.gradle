plugins { id "com.android.application" }

// Número de versión: lo pone GitHub Actions en cada compilación (-PversionCode=N)
def vCode = (project.findProperty("versionCode") ?: "1").toString().toInteger()

android {
    namespace "com.censo.comunitario"
    compileSdk 34
    defaultConfig {
        applicationId "com.censo.comunitario"
        minSdk 21
        targetSdk 34
        versionCode vCode
        versionName "1." + vCode
    }
    // Firma fija: así cada APK nuevo se instala encima del anterior sin perder los datos
    signingConfigs {
        release {
            def ks = System.getenv("CENSO_KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("CENSO_KEYSTORE_PASSWORD")
                keyAlias "censo"
                keyPassword System.getenv("CENSO_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("CENSO_KEYSTORE_FILE")) signingConfig signingConfigs.release
        }
    }
    // Copia la app web (carpeta ../www) dentro del APK
    sourceSets { main { assets.srcDirs = ["../../www"] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
